<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta property="og:title" content="CLASSY Purchase Order - Picking List"><meta property="og:image" content="https://jbai-djls.github.io/classy-picks/logo.png"><meta name="twitter:card" content="summary">
<title>CLASSY 采购补货单 · 拣货单</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; -webkit-text-size-adjust: 100%; }
  body { margin: 0; font-family: -apple-system, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
         background: #f5f6f8; color: #1c2330; font-size: 16px; }
  header { background: #fff; padding: 14px 16px; border-bottom: 1px solid #e3e6eb; position: sticky; top: 0; z-index: 5; }
  header h1 { margin: 0 0 2px; font-size: 18px; }
  header .meta { color: #6b7280; font-size: 13px; overflow-wrap: anywhere; }
  main { padding: 12px 10px 96px; max-width: 760px; margin: 0 auto; }
  table { width: 100%; border-collapse: separate; border-spacing: 0 8px; }
  tr { background: #fff; }
  td { vertical-align: middle; padding: 10px; }
  .imgcell { width: 64px; padding-right: 2px; }
  .imgcell img, .noimg { width: 60px; height: 60px; object-fit: cover; border-radius: 8px; background: #eef0f3; display: block; }
  .noimg { text-align: center; line-height: 60px; color: #b6bcc7; font-size: 22px; }
  .pname { font-weight: 600; margin-bottom: 4px; overflow-wrap: anywhere; }
  .micro { color: #6b7280; font-size: 12px; }
  .qtycell { width: 108px; text-align: center; }
  .qtyInput { width: 100%; font-size: 18px; padding: 10px 6px; border: 1.5px solid #d3d8e0; border-radius: 10px; text-align: center; }
  .qtyInput:focus { outline: none; border-color: #3b82f6; }
  .noteInput { width: 100%; margin-top: 6px; font-size: 13px; padding: 6px 8px; border: 1px solid #e3e6eb; border-radius: 8px; }
  .lineState { margin-top: 4px; min-height: 14px; }
  .st-all { color: #15803d; } .st-short { color: #b45309; } .st-out { color: #b91c1c; } .st-over { color: #7c3aed; }
  .toolbar { position: fixed; left: 0; right: 0; bottom: 0; background: #fff; border-top: 1px solid #e3e6eb;
             padding: 10px 14px calc(10px + env(safe-area-inset-bottom)); }
  .stats { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; color: #4b5563; margin-bottom: 8px; }
  .stats b { color: #1c2330; }
  button.primary { width: 100%; padding: 14px; font-size: 17px; font-weight: 600; border: 0; border-radius: 12px;
                   background: #2563eb; color: #fff; }
  button.primary:active { background: #1e4fc0; }
  .hint { color: #6b7280; font-size: 12px; margin: 6px 2px 0; }
  .toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: 120px; background: #1c2330; color: #fff;
           padding: 8px 16px; border-radius: 20px; font-size: 13px; opacity: 0; transition: opacity .25s; pointer-events: none; z-index: 30; }
  .toast.show { opacity: .92; }
  #resultBox { display: none; padding: 16px; background: #fff; border-radius: 14px; text-align: center; margin-bottom: 96px; }
  #resultBox img.qr { width: min(78vw, 420px); image-rendering: pixelated; }
  .resCard { border: 1px solid #e3e6eb; border-radius: 12px; display: inline-block; padding: 18px 22px; margin: 10px 0; text-align: left; }
  .resCard h2 { margin: 0 0 8px; font-size: 17px; }
  .resCard .row { font-size: 14px; line-height: 1.9; }
  .resCard .row b { font-weight: 700; }
  .btnGhost { display: inline-block; margin: 6px 4px 0; padding: 10px 14px; border-radius: 10px; border: 1.5px solid #2563eb;
              color: #2563eb; background: #fff; font-size: 14px; text-decoration: none; }
  .errBox { margin: 60px auto; max-width: 480px; background: #fff; border-radius: 14px; padding: 28px; text-align: center; color: #b91c1c; }
  @media print { .toolbar { display: none; } }
</style>

<body>
<header>
  <h1>CLASSY 采购补货单 · 拣货单</h1>
  <div class="meta">清单名称: <b id="hName"></b> · 单号: <b id="hPo"></b>
    · 修订 <span id="revNo">1</span></div>
</header>
<main>
  <table id="lines"><tbody id="linesBody"></tbody></table>
  <div id="resultBox">
    <div class="resCard">
      <h2>CLASSY 拣货结果</h2>
      <div class="row">清单名称:<b id="rName"></b></div>
      <div class="row">清单编号:<b id="rPo"></b></div>
      <div class="row">状态:<b id="rStatus"></b></div>
      <div class="row">总款数:<b id="rLines"></b>
        &nbsp;订购:<b id="rOrdered"></b> &nbsp;实拣:<b id="rPicked"></b>
        &nbsp;缺货:<b id="rShort"></b></div>
      <div class="row">实拣总成本:<b id="rPCost">&#8369;&mdash;</b></div>
      <div class="row">时间:<b id="rTime"></b></div>
    </div>
    <div id="qrWrap"><img class="qr" id="qrImg" alt="QR"></div>
    <div><a class="btnGhost" id="dlPng" download="pick.png">保存二维码图片(手机长按)</a>
    <a class="btnGhost" id="dlFile" download="pick.json">保存结果文件(.json)</a></div>
    <p class="hint" id="submitNote" style="display:none"></p>
    <p class="hint">结果已生成——请把二维码图片通过聊天软件发回。</p>
    <button class="btnGhost" id="regen" style="cursor:pointer">重新编辑(生成新修订)</button>
  </div>
</main>
<div class="toolbar">
  <div class="stats">
    <span>订购总数: <b id="sOrdered">0</b></span>
    <span>实拣总数: <b id="sPicked">0</b></span>
    <span>缺货总数: <b id="sShort">0</b></span>
    <span>缺货行数: <b id="sShortLines">0</b></span>
    <span>订购总成本: <b id="sOCost">&#8369;&mdash;</b></span>
    <span>实拣总成本: <b id="sPCost">&#8369;&mdash;</b></span>
  </div>
  <button class="primary" id="btnDone">拣货完毕</button>
  <p class="hint">核对每行实际数量后,点击「拣货完毕」生成结果二维码。</p>
</div>
<div class="toast" id="toast"></div>
<script>//---------------------------------------------------------------------
//

// URL: http://www.d-project.com/

//  http://www.opensource.org/licenses/mit-license.php

// DENSO WAVE INCORPORATED

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }

          if (buffer.getLengthInBits() <= totalDataCount * 8) {
            break;
          }
        }

        _typeNumber = typeNumber;
      }

      makeImpl(false, getBestMaskPattern() );
    };

    _this.createTableTag = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var qrHtml = '';

      qrHtml += '<table style="';
      qrHtml += ' border-width: 0px; border-style: none;';
      qrHtml += ' border-collapse: collapse;';
      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';
      qrHtml += '">';
      qrHtml += '<tbody>';

      for (var r = 0; r < _this.getModuleCount(); r += 1) {

        qrHtml += '<tr>';

        for (var c = 0; c < _this.getModuleCount(); c += 1) {
          qrHtml += '<td style="';
          qrHtml += ' border-width: 0px; border-style: none;';
          qrHtml += ' border-collapse: collapse;';
          qrHtml += ' padding: 0px; margin: 0px;';
          qrHtml += ' width: ' + cellSize + 'px;';
          qrHtml += ' height: ' + cellSize + 'px;';
          qrHtml += ' background-color: ';
          qrHtml += _this.isDark(r, c)? '#000000' : '#ffffff';
          qrHtml += ';';
          qrHtml += '"/>';
        }

        qrHtml += '</tr>';
      }

      qrHtml += '</tbody>';
      qrHtml += '</table>';

      return qrHtml;
    };

    _this.createSvgTag = function(cellSize, margin, alt, title) {

      var opts = {};
      if (typeof arguments[0] == 'object') {
        // Called by options.
        opts = arguments[0];
        // overwrite cellSize and margin.
        cellSize = opts.cellSize;
        margin = opts.margin;
        alt = opts.alt;
        title = opts.title;
      }

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      // Compose alt property surrogate
      alt = (typeof alt === 'string') ? {text: alt} : alt || {};
      alt.text = alt.text || null;
      alt.id = (alt.text) ? alt.id || 'qrcode-description' : null;

      // Compose title property surrogate
      title = (typeof title === 'string') ? {text: title} : title || {};
      title.text = title.text || null;
      title.id = (title.text) ? title.id || 'qrcode-title' : null;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var c, mc, r, mr, qrSvg='', rect;

      rect = 'l' + cellSize + ',0 0,' + cellSize +
        ' -' + cellSize + ',0 0,-' + cellSize + 'z ';

      qrSvg += '<svg version="1.1" xmlns="http://www.w3.org/2000/svg"';
      qrSvg += !opts.scalable ? ' width="' + size + 'px" height="' + size + 'px"' : '';
      qrSvg += ' viewBox="0 0 ' + size + ' ' + size + '" ';
      qrSvg += ' preserveAspectRatio="xMinYMin meet"';
      qrSvg += (title.text || alt.text) ? ' role="img" aria-labelledby="' +
          escapeXml([title.id, alt.id].join(' ').trim() ) + '"' : '';
      qrSvg += '>';
      qrSvg += (title.text) ? '<title id="' + escapeXml(title.id) + '">' +
          escapeXml(title.text) + '</title>' : '';
      qrSvg += (alt.text) ? '<description id="' + escapeXml(alt.id) + '">' +
          escapeXml(alt.text) + '</description>' : '';
      qrSvg += '<rect width="100%" height="100%" fill="white" cx="0" cy="0"/>';
      qrSvg += '<path d="';

      for (r = 0; r < _this.getModuleCount(); r += 1) {
        mr = r * cellSize + margin;
        for (c = 0; c < _this.getModuleCount(); c += 1) {
          if (_this.isDark(r, c) ) {
            mc = c*cellSize+margin;
            qrSvg += 'M' + mc + ',' + mr + rect;
          }
        }
      }

      qrSvg += '" stroke="transparent" fill="black"/>';
      qrSvg += '</svg>';

      return qrSvg;
    };

    _this.createDataURL = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      return createDataURL(size, size, function(x, y) {
        if (min <= x && x < max && min <= y && y < max) {
          var c = Math.floor( (x - min) / cellSize);
          var r = Math.floor( (y - min) / cellSize);
          return _this.isDark(r, c)? 0 : 1;
        } else {
          return 1;
        }
      } );
    };

    _this.createImgTag = function(cellSize, margin, alt) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;

      var img = '';
      img += '<img';
      img += '\u0020src="';
      img += _this.createDataURL(cellSize, margin);
      img += '"';
      img += '\u0020width="';
      img += size;
      img += '"';
      img += '\u0020height="';
      img += size;
      img += '"';
      if (alt) {
        img += '\u0020alt="';
        img += escapeXml(alt);
        img += '"';
      }
      img += '/>';

      return img;
    };

    var escapeXml = function(s) {
      var escaped = '';
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charAt(i);
        switch(c) {
        case '<': escaped += '&lt;'; break;
        case '>': escaped += '&gt;'; break;

var $ = function (id) { return document.getElementById(id); };
var PO = null;
var state = { rev: 1, qty: {}, note: {} };

function toast(msg) { var t = $('toast'); t.textContent = msg; t.classList.add('show');
  setTimeout(function () { t.classList.remove('show'); }, 1600); }

/* ---- 通用页:从链接 hash 解码数据(gzip+base64url,与 CLASSY po-publish 一致) ---- */
async function decodeHashPo() {
  var m = /[#&]d=([A-Za-z0-9_-]+)/.exec(location.hash || '');
  if (!m) throw new Error(T.badLink);
  var b64 = m[1].replace(/-/g, '+').replace(/_/g, '/');
  var bin = atob(b64 + '==='.slice((b64.length + 3) % 4));
  var bytes = new Uint8Array(bin.length);
  for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  var ds = new DecompressionStream('gzip');
  var text = await new Response(new Blob([bytes]).stream().pipeThrough(ds)).text();
  var obj = JSON.parse(text);
  if (!obj || obj.t !== 'CP' || obj.v !== 1 || !obj.id || !Array.isArray(obj.r) || !obj.r.length) {
    throw new Error(T.badLink);
  }
  var rows = obj.r.map(function (r) {
    return { key: r[0], name: r[1] || '', color: r[2] || '', size: r[3] || '', order_qty: r[4],
             unit_cost: (r.length > 5 && r[5] != null) ? r[5] : null };
  });
  return { po_id: String(obj.id), name: String(obj.n || ''), lang: obj.l === 'zh' ? 'zh' : 'en', rows: rows };
}

function renderRows() {
  var zh = PO.lang === 'zh';
  var html = PO.rows.map(function (r) {
    var img = r.img ? '<img src="' + r.img + '" alt="">'
      : '<div class="noimg">·</div>';
    return '<tr data-key="' + r.key + '" data-order="' + r.order_qty + '"' +
      (r.unit_cost != null ? ' data-cost="' + r.unit_cost + '"' : '') + '>' +
      '<td class="imgcell">' + img + '</td>' +
      '<td class="infocell"><div class="pname"></div>' +
      '<div class="micro"></div>' +
      '<input class="noteInput" placeholder="' + (zh ? '该行备注(可选)' : 'Note for this line (optional)') + '" maxlength="200"></td>' +
      '<td class="qtycell"><input class="qtyInput" type="number" inputmode="numeric" min="0" max="9999" step="1" value="' + r.order_qty + '">' +
      '<div class="lineState micro"></div><div class="costLine micro"></div></td></tr>';
  }).join('');
  document.getElementById('linesBody').innerHTML = html;
  var trs = document.querySelectorAll('#linesBody tr');
  PO.rows.forEach(function (r, i) {
    trs[i].querySelector('.pname').textContent = r.name;
    var micro = r.color + ' / ' + r.size + ' · ' + (zh ? '订购' : 'Order') + ' ' + r.order_qty;
    if (r.unit_cost != null) micro += ' · ' + (zh ? '成本单价' : 'Unit cost') + ' ₱' + r.unit_cost.toFixed(2);
    trs[i].querySelector('.micro').textContent = micro;
  });
}

/* ---- 草稿恢复 ---- */
function lsKey() { return 'classy_pick_' + PO.po_id + '_' + (state.rev || 1); }
function restoreDraft() {
  try {
    var saved = JSON.parse(localStorage.getItem(lsKey()) || 'null');
    if (saved && saved.qty) { state = saved; toast(T.stored); }
  } catch (e) { /* 草稿损坏按空白开始 */ }
}

function rows() { return Array.prototype.slice.call(document.querySelectorAll('#linesBody tr')); }

function readRow(tr) {
  var key = tr.getAttribute('data-key');
  var input = tr.querySelector('.qtyInput');
  var v = Math.floor(Number(input.value));
  return { key: key, qty: isNaN(v) ? -1 : v, input: input };
}

function refresh() {
  var ordered = 0, picked = 0, shortLines = 0;
  var orderedCost = 0, pickedCost = 0, anyCost = false;
  rows().forEach(function (tr) {
    var order = Number(tr.getAttribute('data-order'));
    var costStr = tr.getAttribute('data-cost');
    var unitCost = costStr != null && costStr !== '' ? Number(costStr) : null;
    if (unitCost != null) anyCost = true;
    var r = readRow(tr);
    var q = r.qty;
    var st = tr.querySelector('.lineState');
    var cl = tr.querySelector('.costLine');
    if (cl) cl.textContent = '';
    tr.classList.remove('over');
    if (q < 0 || q > 9999) { st.textContent = T.invalidQty; st.className = 'lineState micro st-out'; return; }
    state.qty[r.key] = q;
    ordered += order; picked += q;
    if (unitCost != null) {
      orderedCost += order * unitCost;
      pickedCost += q * unitCost;
      if (cl) cl.textContent = T.costSub + ' ₱' + (q * unitCost).toFixed(2);
    }
    var diff = q - order;
    if (q === 0) { st.textContent = T.out; st.className = 'lineState micro st-out'; shortLines++; }
    else if (diff < 0) { st.textContent = T.partShort + ' ' + (-diff); st.className = 'lineState micro st-short'; shortLines++; }
    else if (diff > 0) { st.textContent = T.over + ' +' + diff; st.className = 'lineState micro st-over'; tr.classList.add('over'); }
    else { st.textContent = T.all; st.className = 'lineState micro st-all'; }
  });
  $('sOrdered').textContent = ordered; $('sPicked').textContent = picked;
  $('sShort').textContent = Math.max(0, ordered - picked);
  $('sShortLines').textContent = shortLines;
  $('sOCost').textContent = anyCost ? '₱' + orderedCost.toFixed(2) : '—';
  $('sPCost').textContent = anyCost ? '₱' + pickedCost.toFixed(2) : '—';
}

function saveDraft() {
  try { localStorage.setItem(lsKey(), JSON.stringify(state)); } catch (e) { /* 隐私模式忽略 */ }
}

document.getElementById('lines').addEventListener('input', function (e) {
  var tr = e.target.closest('tr'); if (!tr) return;
  if (e.target.classList.contains('noteInput')) {
    state.note[tr.getAttribute('data-key')] = e.target.value;
  } else { refresh(); }
  saveDraft();
});

function currentRows() {
  var out = [], bad = false;
  rows().forEach(function (tr) {
    var r = readRow(tr);
    if (r.qty < 0 || r.qty > 9999) { bad = true; r.input.focus(); }
    out.push({ key: r.key, qty: r.qty < 0 ? 0 : r.qty });
  });
  return { rows: out, bad: bad };
}

function collectNotes() {
  var n = {};
  document.querySelectorAll('#linesBody tr').forEach(function (tr) {
    var v = tr.querySelector('.noteInput').value.trim();
    if (v) n[tr.getAttribute('data-key')] = v;
  });
  return n;
}

/* 与 CLASSY purchase-order.js 完全一致的载荷与摘要(FNV-1a 双 32 位截断) */
function encodePick(poId, rev, rows) {
  function fnv(s) { var h1 = 0x811c9dc5, h2 = 0x01000193;
    for (var i = 0; i < s.length; i++) { var c = s.charCodeAt(i);
      h1 = ((h1 ^ c) >>> 0); h1 = (Math.imul(h1, 16777619) >>> 0);
      h2 = ((h2 + c * (i + 1)) >>> 0); h2 = (Math.imul(h2, 2246822519) >>> 0); }
    return ('00000000' + (h1 >>> 0).toString(16)).slice(-8) + ('00000000' + (h2 >>> 0).toString(16)).slice(-8); }
  var po8 = poId.slice(-8);
  var body = rows.map(function (r) { return r.key + '.' + r.qty; }).join(',');
  // 与 CLASSY pickDigest 一致:摘要取 8 位 hex(此前 16 位导致导入端完整性校验必然失败)
  var digest = fnv(po8 + '|' + rev + '|' + body).slice(0, 8);
  return { text: 'CP1|' + po8 + '|' + rev + '|' + rows.length + '|' + digest + '|' + body, digest: digest };
}

function makeQrImg(text) {
  var qr = window.qrcode(0, 'Q'); qr.addData(text, 'Byte'); qr.make();
  var n = qr.getModuleCount(), cell = Math.max(6, Math.floor(1400 / (n + 8))), quiet = 4;
  var px = (n + quiet * 2) * cell;
  var c = document.createElement('canvas'); c.width = c.height = px;
  var x = c.getContext('2d');
  x.fillStyle = '#fff'; x.fillRect(0, 0, px, px);
  x.fillStyle = '#000';
  for (var r = 0; r < n; r++) for (var cc = 0; cc < n; cc++)
    if (qr.isDark(r, cc)) x.fillRect((cc + quiet) * cell, (r + quiet) * cell, cell, cell);
  return c.toDataURL('image/png');
}

$('btnDone').addEventListener('click', function () {
  var cur = currentRows();
  if (cur.bad) { toast(T.invalidQty); return; }
  var over = cur.rows.some(function (r, i) {
    return r.qty > Number(document.querySelectorAll('#linesBody tr')[i].getAttribute('data-order'));
  });
  if (over && !window.confirm(T.confirmOver)) return;
  var enc = encodePick(PO.po_id, state.rev || 1, cur.rows);
  if (CLOUD && CLOUD.submitUrl) {
    var bd = $('btnDone'); bd.disabled = true;
    var oldTxt = bd.textContent; bd.textContent = T.submitting;
    fetch(CLOUD.submitUrl, { method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ po8: PO.po_id.slice(-8),
        poToken: CLOUD.poToken || ((location.pathname.match(new RegExp('^/p/([0-9a-f]{32})/?$')) || [])[1] || ''),
        rev: state.rev || 1, digest: enc.digest, rows: cur.rows, notes: state.note }) })
    .then(function (r) { return r.json().then(function (d) { return { status: r.status, d: d }; }); })
    .then(function (res) {
      bd.disabled = false; bd.textContent = oldTxt;
      if (res.status === 200 && res.d && res.d.ok) {
        fillResultCard();
        $('rStatus').textContent = T.submitOk;
        $('rStatus').style.color = '#15803d';
        $('submitNote').textContent = T.submitOkHint +
          ' (#' + (res.d.submitId || '').slice(0, 8) + (res.d.duplicate ? ' · dup' : '') + ')';
        $('submitNote').style.display = 'block';
        $('qrWrap').style.display = 'none';
        $('resultBox').style.display = 'block';
        $('resultBox').scrollIntoView({ behavior: 'smooth', block: 'start' });
      } else {
        toast(T.submitFail + ' (HTTP ' + res.status + ': ' + (res.d && res.d.error || 'invalid response') + ')');
        showQrFallback(enc);
      }
    })
    .catch(function (err) {
      bd.disabled = false; bd.textContent = oldTxt;
      toast(T.submitFail + ' (' + (err.message || String(err)) + ')'); showQrFallback(enc);
    });
    return;
  }
  function showQrFallback(enc2) {
    fillResultCard();
    $('qrImg').src = makeQrImg(enc2.text);
    $('dlPng').href = $('qrImg').src;
    $('dlPng').parentElement.style.display = 'block';
    $('qrWrap').style.display = 'block';
    $('resultBox').style.display = 'block';
    $('resultBox').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
  function fillResultCard() {
    var now = new Date();
    var pad = function (v) { return String(v).padStart(2, '0'); };
    var timeStr = now.getFullYear() + '-' + pad(now.getMonth() + 1) + '-' + pad(now.getDate()) + ' ' +
                  pad(now.getHours()) + ':' + pad(now.getMinutes());
    var ordered = Number($('sOrdered').textContent), picked = Number($('sPicked').textContent);
    $('rName').textContent = PO.name; $('rPo').textContent = PO.po_id;
    $('rStatus').textContent = picked === 0 ? T.stEmpty : (picked < ordered ? T.stPartial : T.stComplete);
    $('rStatus').style.color = '';
    $('rLines').textContent = PO.rows.length;
    $('rOrdered').textContent = ordered; $('rPicked').textContent = picked;
    $('rShort').textContent = Math.max(0, ordered - picked); $('rTime').textContent = timeStr;
    $('rPCost').textContent = $('sPCost').textContent;
  }
  var dlBase = (PO.po_id || 'pick').replace(/[^A-Za-z0-9_-]/g, '');
  $('dlPng').download = dlBase + '-pick.png';
  var file = { t: 'CLASSY-PICK', v: 1, po8: PO.po_id.slice(-8), po_id: PO.po_id, name: PO.name,
    lang: PO.lang, rev: state.rev || 1, picked_at: now.toISOString(),
    rows: cur.rows.map(function (r) { return { key: r.key, qty: r.qty, note: state.note[r.key] || '' }; }),
    digest: enc.digest };
  $('dlFile').href = 'data:application/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(file, null, 1));
  $('dlFile').download = dlBase + '-pick.json';
  $('resultBox').style.display = 'block';
  $('resultBox').scrollIntoView({ behavior: 'smooth', block: 'start' });
});

$('regen').addEventListener('click', function () {
  state.rev = (state.rev || 1) + 1;
  $('revNo').textContent = state.rev;
  $('resultBox').style.display = 'none';
  saveDraft();
  window.scrollTo({ top: 0, behavior: 'smooth' });
});

(async function init() {
  try {
    if (MODE === 'hash') PO = await decodeHashPo();
    else PO = INLINE_PO;
  } catch (e) {
    document.body.innerHTML = '<div class="errBox"><b>' + (MODE === 'hash'
      ? (T.badLink) : 'Init error') + '</b></div>';
    return;
  }
  $('hName').textContent = PO.name; $('hPo').textContent = PO.po_id;
  renderRows();
  restoreDraft();
  refresh();
})();
</script>
</body>
</html>
